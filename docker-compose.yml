services:
  shaheen:
    build: .
    user: "${SHAHEEN_UID:-1000}:${SHAHEEN_GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evidence:/app/evidence
      - shaheen-var:/app/var

  watch:
    build: .
    user: "${SHAHEEN_UID:-1000}:${SHAHEEN_GID:-1000}"
    command: watch
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evidence:/app/evidence
      - shaheen-var:/app/var

  dashboard:
    build: .
    user: "${SHAHEEN_UID:-1000}:${SHAHEEN_GID:-1000}"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evidence:/app/evidence
      - shaheen-var:/app/var

volumes:
  shaheen-var:
