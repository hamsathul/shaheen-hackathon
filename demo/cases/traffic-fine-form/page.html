<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>TAMM | Traffic Fines Inquiry and Payment</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #eef1f4; color: #1d2733; }
  .bar { background: #0b3d5c; color: #fff; padding: 16px 44px; font-size: 22px; font-weight: 600; }
  .bar span { font-weight: 400; font-size: 14px; margin-left: 14px; opacity: .8; }
  .wrap { width: 560px; margin: 34px auto; background: #fff; padding: 28px 34px; border-top: 4px solid #0b3d5c; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; color: #44505c; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; color: #44505c; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #b9c2cc; font-size: 15px; }
  button { margin-top: 22px; width: 100%; padding: 12px; background: #0b3d5c; color: #fff; border: 0; font-size: 16px; }
  .foot { text-align: center; font-size: 12px; color: #6b7682; }
</style>
</head>
<body>
<div class="bar">TAMM <span>Abu Dhabi Government Services</span></div>
<div class="wrap">
  <h1>Traffic fine inquiry</h1>
  <p>Check and settle any traffic fine registered against your vehicle. Enter your details below.</p>
  <form method="post" action="/inquiry">
    <label for="eid">Emirates ID number</label>
    <input id="eid" name="emirates_id" type="text" placeholder="784-XXXX-XXXXXXX-X">
    <label for="plate">Plate number</label>
    <input id="plate" name="plate_number" type="text">
    <label for="mob">Mobile number</label>
    <input id="mob" name="mobile" type="tel">
    <button type="submit">Search fines</button>
  </form>
</div>
<p class="foot">Synthetic demo page on an invented domain.</p>


</body></html>
