<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Baaz{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="wordmark" href="/">
    <span class="wordmark-ar" lang="ar">باز</span>
    <span class="wordmark-en" lang="en">Baaz</span>
  </a>
  <p class="tagline">{{ t.tagline }}</p>
  <nav>
    <a href="/"{% if here == "/" %} aria-current="page"{% endif %}>{{ t.feed }}</a>
    <a class="switch" lang="{{ 'en' if lang == 'ar' else 'ar' }}" href="/lang/{{ 'en' if lang == 'ar' else 'ar' }}?next={{ here | urlencode }}">{{ t.switch }}</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="bottom">{{ t.defanged }}</footer>
<script type="application/json" id="strings">{{ js_strings | tojson }}</script>
{% block scripts %}{% endblock %}
</body>
</html>
