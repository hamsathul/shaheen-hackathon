[project]
name = "baaz"
version = "0.1.0"
description = "24/7 scam-site hunter for UAE brands, investigated by a local AI model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6",
    "dnstwist>=20240812",
    "fastapi>=0.115",
    "httpx>=0.27",
    "imagehash>=4.3",
    "jinja2>=3.1",
    "mcp>=1.9",
    "pillow>=10.4",
    "playwright==1.65.2",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
    "uvicorn>=0.30",
]

[project.scripts]
baaz = "baaz.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baaz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
